<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MFEIA 49 周年 · 晚宴流程</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <!-- 左上角 MFEIA logo：只留标志本身，不套边框卡。放在 #stage 外面所以待机时也在。 -->
    <img class="brand-logo" id="brand-logo" alt="MFEIA" />

    <!--
      标题带与四种环节面板全部由 apps/stage/presenter.ts 建 —— /screen 的环节叠加层
      共用同一个 presenter 和同一份 panes.css，两块屏的版式因此不会走样。
    -->
    <div id="stage" data-kind=""></div>

    <div class="idle" id="idle">
      <div class="idle-title">MFEIA 49 周年纪念晚宴</div>
      <div class="idle-sub">等 待 环 节 开 始</div>
    </div>

    <div class="motto">团 结 · 专 业 · 创 新 · 共 赢</div>

    <script type="module" src="./stage.ts"></script>
  </body>
</html>
