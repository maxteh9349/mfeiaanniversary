<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MFEIA 49 周年 · 虚拟社交大厅</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <!--
      流程环节叠加层：操作台点「上台」时，把该环节的图片盖在大厅画面上（3D 场景
      压暗、HUD 照常显示），不再把投影切到 /stage。没上传图片的环节退回标题文字卡。
      放在 #hud 之前，所以压暗只作用于 3D 场景，HUD 仍浮在最上层。
    -->
    <div id="segment-overlay">
      <div class="seg-frame">
        <i class="corner tl"></i><i class="corner tr"></i>
        <i class="corner bl"></i><i class="corner br"></i>
        <img id="segment-photo" alt="" />
        <!-- 环节短片：上台即播，播完停在最后一帧等操作台切走。playsinline 防手机全屏接管。 -->
        <video id="segment-video" playsinline preload="auto"></video>
        <!--
          机器人举牌：assets/board/robot.png 是一张「牌面留空」的模板图，全场 19 个
          环节共用；中英标题由代码实时写在牌面上，所以临场改环节名字
          大屏跟着变，不用重新出图。牌面文字区的位置是 style.css 里的 4 个百分比
          变量（--board-left/top/width/height），换图后微调这几个数即可对准。
          模板缺失时整块退回下面这张纯文字卡，绝不留空。
        -->
        <div id="segment-card">
          <img id="segment-board-art" src="/board/robot.png" alt="" hidden />
          <!-- 牌面只放中英标题：时间 / 副标题 / 备注是流程表的内部信息，留在后台。 -->
          <div class="seg-board-text">
            <div class="seg-board-main">
              <h2 id="segment-card-zh"></h2>
              <div id="segment-card-en"></div>
            </div>
          </div>
        </div>
      </div>

      <!--
        晚宴流程环节版式（致辞 / 逐位颁奖 / 整屏名单 / 赞助商感谢状）：与 /stage 整页
        共用 apps/stage/presenter.ts + panes.css，内容由它建，这里只留一个空容器。
        和抽奖图层同理，必须放在 .seg-frame **外面** —— 那个框有 transform，会成为
        子元素的包含块，整屏名单会被压进那一小块里。
      -->
      <div id="stage-layer"></div>

      <!--
        幸运抽奖（kind=lucky_draw）：和 /draw 独立页共用 apps/draw/presenter.ts，
        只是把画面叠在大厅大屏上、不换页。标题栏与标语用 HUD 已有的，不重复搬。
        必须放在 .seg-frame **外面** —— 那个框有 transform，会成为 position:fixed
        子元素的包含块，抽奖画面会被压缩进那一小块里。
      -->
      <div id="draw-layer">
        <div class="prize-card">
          <div class="prize-level" id="prize-level"></div>
          <img class="prize-img" id="prize-img" alt="" />
          <div class="prize-name" id="prize-name">幸运抽奖</div>
          <div class="prize-sponsor" id="prize-sponsor"></div>
        </div>

        <div class="reel-wrap">
          <div class="reel-label">🎉 幸 运 之 星 🎉</div>
          <div class="reel" id="reel">准备开始</div>
        </div>

        <div class="countdown" id="countdown"></div>

        <div class="reveal" id="reveal">
          <div class="reveal-inner">
            <div class="reveal-congrats">🎉 恭 喜 中 奖 🎉</div>
            <div class="reveal-name" id="reveal-name"></div>
            <div class="reveal-prize" id="reveal-prize"></div>
            <div class="reveal-sponsor" id="reveal-sponsor"></div>
          </div>
        </div>

        <canvas id="confetti"></canvas>
      </div>
    </div>

    <div id="hud">
      <!-- outer glowing frame + corner brackets -->
      <div class="screen-frame">
        <i class="corner tl"></i><i class="corner tr"></i>
        <i class="corner bl"></i><i class="corner br"></i>
      </div>

      <!-- 左上角 MFEIA logo：只留标志本身，不套边框卡（与 /stage 一致）。 -->
      <img class="brand-logo" id="brand-logo" alt="MFEIA" />

      <header class="hud-top">
        <div class="hud-title-wrap">
          <div class="welcome-zh">欢 迎 莅 临</div>
          <div class="tech-box title-box">
            <div class="tech-inner">
              <h1>马六甲机器厂商公会 <b>49 周年纪念</b></h1>
            </div>
          </div>
          <div class="slogan">携手创新 · 共塑未来</div>
        </div>

      </header>

      <aside class="hud-left tech-box">
        <div class="tech-inner panel-inner">
          <div class="panel-title">最新签到嘉宾</div>
          <ul id="recent-list" class="recent"></ul>
        </div>
      </aside>

      <!-- 赞助商：「赞助商」小字在上、白底板 logo 在下，不套斜角卡壳（与左上 MFEIA logo 一致）。 -->
      <aside class="hud-right">
        <div class="sponsor-sub">赞助商</div>
        <div class="sponsor-logo" id="sponsor-logo">
          <svg viewBox="0 0 40 40" class="hex-mark" aria-hidden="true">
            <polygon points="20,3 33,20 20,20" fill="#3fb6e6" />
            <polygon points="20,20 33,20 20,37" fill="#7ac943" />
            <polygon points="20,3 20,20 7,20" fill="#2e6fb0" />
            <polygon points="7,20 20,20 20,37" fill="#f2c200" />
          </svg>
          <span class="hex-text">HEXAGON</span>
        </div>
      </aside>

      <footer class="hud-bottom">
        <div class="tech-box flow">
          <div class="tech-inner flow-inner">
            <span class="flow-title">签到流程</span>
            <img id="qr" class="qr" alt="签到二维码" />
            <span class="flow-step"><b>①</b> 扫描二维码<br />进行签到</span>
            <span class="flow-arrow">→</span>
            <span class="flow-step">
              <svg class="step-icon" viewBox="0 0 48 48">
                <g fill="none" stroke="#7fc6ff" stroke-width="3" stroke-linecap="round">
                  <path d="M6 16V8h8M42 16V8h-8M6 32v8h8M42 32v8h-8" />
                </g>
                <g fill="#7fc6ff">
                  <circle cx="24" cy="21" r="6.5" />
                  <path d="M15 37c1.5-7 16.5-7 18 0z" />
                </g>
              </svg>
              <b>②</b> 签到成功<br />欢迎加入
            </span>
            <span class="flow-arrow">→</span>
            <span class="flow-step">
              <svg class="step-icon" viewBox="0 0 48 48"><g fill="#9fd6ff">
                <circle cx="17" cy="17" r="6" /><circle cx="31" cy="17" r="6" />
                <path d="M7 38c0-7 6-11 10-11s10 4 10 11zM27 38c0-7 4-11 8-11s8 4 8 11z" /></g></svg>
              <b>③</b> 您的虚拟形象<br />进入会场
            </span>
          </div>
        </div>

      </footer>

      <div class="bottom-left">
        <div class="tech-box counter-card">
          <div class="tech-inner">
            <div class="counter-badge">智能签到系统</div>
            <div class="counter-label">签到总人数</div>
            <div id="counter" class="counter-num">0</div>
            <div class="counter-unit">位嘉宾</div>
          </div>
        </div>
      </div>

      <div class="bottom-right">
        <div class="tech-box clock">
          <div class="tech-inner">
            <div class="clock-badge">人工智能 · 创新 · 未来</div>
            <div id="clock-time" class="clock-time">--:--</div>
            <div id="clock-date" class="clock-date"></div>
          </div>
        </div>
      </div>

      <div class="motto">团 结 · 专 业 · 创 新 · 共 赢</div>

      <!-- hero reveal: full-screen welcome poster shown on check-in -->
      <div id="hero-reveal">
        <div class="hero-frame">
          <img class="hero-poster" alt="欢迎" />
          <div class="hero-name-overlay">
            <span class="hero-name"></span>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
